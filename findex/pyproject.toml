[project]
name = "findex"
version = "0.4.0"
description = "A simple search engine index and CLI"
authors = [ { name = "Твоє Ім'я", email = "test@example.com" } ]

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0"
]

[project.scripts]
# Це дозволить запускати програму командою findex з будь-якого місця
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0"
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "-v --cov=findex"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"